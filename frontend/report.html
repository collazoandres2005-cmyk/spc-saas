<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe de Análisis — SPC</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* ── Layout de informe ──────────────────────────────────── */
    .report-sections { display: flex; flex-direction: column; gap: 20px; }

    .rep-header {
      text-align: center; padding: 28px 20px 18px;
      background: var(--glass-card); border: 1px solid var(--glass-border);
      backdrop-filter: var(--glass-blur); border-radius: var(--radius);
      position: relative; overflow: hidden;
    }
    .rep-header::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #4ade80);
    }
    .rep-h1 { font-size: 24px; font-weight: 900; color: var(--text); letter-spacing: -.5px; }
    .rep-h1-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .rep-meta { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--text-sec); }
    .rep-meta span { display: inline-flex; align-items: center; gap: 4px; }

    .rep-section {
      background: var(--glass-card); border: 1px solid var(--glass-border);
      backdrop-filter: var(--glass-blur); border-radius: var(--radius); overflow: hidden;
    }
    .rep-shead {
      padding: 14px 20px; border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; gap: 10px;
    }
    .rep-shead .ico { font-size: 18px; }
    .rep-stitle { font-size: 15px; font-weight: 800; color: var(--text); }
    .rep-ssub  { font-size: 11px; color: var(--text-muted); margin-left: auto; }

    .rep-body { padding: 16px 20px; }

    .rep-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
    }
    .rep-grid.wide { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .rep-stat {
      background: rgba(255,255,255,.04); border-radius: 6px; padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.06);
    }
    .rep-stat-lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; color: var(--text-muted); margin-bottom: 2px; }
    .rep-stat-val { font-size: 20px; font-weight: 900; color: var(--text); font-variant-numeric: tabular-nums; }
    .rep-stat-sub { font-size: 11px; color: var(--text-sec); margin-top: 2px; }

    .rep-stat.good { border-left: 3px solid var(--success); }
    .rep-stat.warn { border-left: 3px solid var(--warning); }
    .rep-stat.danger { border-left: 3px solid var(--danger); }

    .rep-analysis {
      background: rgba(255,255,255,.04); border-radius: 8px; padding: 14px 16px;
      margin: 12px 0 4px; font-size: 13px; line-height: 1.7; color: var(--text-sec);
      border-left: 3px solid var(--primary);
    }
    .rep-analysis strong { color: var(--text); }
    .rep-analysis .tag {
      display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px;
      border-radius: 4px; margin-right: 6px; text-transform: uppercase; letter-spacing: .3px;
    }
    .rep-analysis .tag.good  { background: rgba(74,222,128,.15); color: #4ade80; }
    .rep-analysis .tag.warn  { background: rgba(251,146,60,.15); color: #fb923c; }
    .rep-analysis .tag.danger{ background: rgba(248,113,113,.15); color: #f87171; }
    .rep-analysis .tag.info  { background: rgba(56,189,248,.15); color: #7dd3fc; }

    .rep-rec-box {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
      border-radius: 8px; padding: 12px 16px; margin-top: 10px;
    }
    .rep-rec-box-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; color: var(--text-muted); margin-bottom: 6px; }
    .rep-rec-item { display: flex; gap: 8px; padding: 6px 0; font-size: 13px; line-height: 1.5; color: var(--text-sec); border-bottom: 1px solid rgba(255,255,255,.04); }
    .rep-rec-item:last-child { border-bottom: none; }
    .rep-rec-item .prio { flex-shrink: 0; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 4px; height: fit-content; margin-top: 2px; }
    .rep-rec-item .prio.high { background: rgba(248,113,113,.15); color: #f87171; }
    .rep-rec-item .prio.med  { background: rgba(251,146,60,.15); color: #fb923c; }
    .rep-rec-item .prio.low  { background: rgba(74,222,128,.15); color: #4ade80; }
    .rep-rec-item .desc { flex: 1; }
    .rep-rec-item .desc strong { color: var(--text); }

    .rep-table-wrap { overflow-x: auto; border-radius: 6px; border: 1px solid var(--glass-border); margin-top: 12px; }
    .rep-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rep-table thead tr { background: rgba(255,255,255,.06); }
    .rep-table thead th {
      padding: 7px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .3px; color: var(--text-sec); text-align: right; white-space: nowrap;
      border: 1px solid var(--glass-border);
    }
    .rep-table thead th:first-child { text-align: left; }
    .rep-table tbody td {
      padding: 6px 12px; border: 1px solid var(--glass-border);
      text-align: right; font-variant-numeric: tabular-nums; color: var(--text);
    }
    .rep-table tbody td:first-child { text-align: left; font-weight: 600; }

    .rep-rec { padding: 10px 14px; border-radius: 6px; font-size: 12px; line-height: 1.5; margin-bottom: 8px; border-left: 3px solid; }
    .rep-rec.good   { background: rgba(74,222,128,.10); border-color: var(--success); color: var(--success); }
    .rep-rec.warn   { background: rgba(251,146,60,.10); border-color: var(--warning); color: var(--warning); }
    .rep-rec.info   { background: rgba(56,189,248,.10); border-color: var(--primary); color: #7dd3fc; }
    .rep-rec.danger { background: rgba(248,113,113,.10); border-color: var(--danger); color: var(--danger); }

    .rep-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .rep-empty-icon { font-size: 32px; margin-bottom: 8px; }
    .rep-empty-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }

    .rep-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .rep-proc-sel { min-width: 300px; }
    .btn-print { display: inline-flex; align-items: center; gap: 6px; }

    .rep-ooc-bad { color: var(--danger); }
    .rep-ooc-ok  { color: var(--success); }

    .cfg-input {
      padding: 7px 10px; border: 1px solid var(--glass-border);
      border-radius: var(--radius); font-size: 14px; font-weight: 600;
      color: var(--text); background: rgba(255,255,255,.05);
      backdrop-filter: var(--glass-blur);
    }
    .cfg-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56,189,248,.15); }

    .rep-conclusion {
      background: linear-gradient(135deg, rgba(56,189,248,.08), rgba(167,139,250,.08));
      border: 1px solid rgba(56,189,248,.2); padding: 16px 20px; border-radius: var(--radius);
      font-size: 13px; line-height: 1.7; color: var(--text-sec);
    }
    .rep-conclusion strong { color: var(--text); }

    /* ── Barra de carga ─────────────────────────────────────── */
    .loading-dots::after {
      content: ''; animation: dots 1.3s steps(4) infinite;
    }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    /* ── Selector de fase ───────────────────────────────────── */
    .phase-tabs { display: flex; gap: 4px; }
    .phase-tab {
      padding: 6px 16px; font-size: 12px; font-weight: 700; cursor: pointer;
      background: rgba(255,255,255,.04); color: var(--text-muted); border: none;
      border-radius: 6px; transition: background .12s, color .12s;
    }
    .phase-tab.active { background: var(--primary); color: #0f172a; }
    .phase-tab:not(.active):hover { background: rgba(255,255,255,.08); color: var(--text); }

    /* ── Print ──────────────────────────────────────────────── */
    @media print {
      body { background: #fff !important; }
      .sidebar, .top-bar, .rep-controls, .btn-print, .sidebar-backdrop { display: none !important; }
      .main-content { margin-left: 0 !important; padding: 0 !important; }
      .rep-header { background: #f8fafc !important; border: 1px solid #e2e8f0 !important; backdrop-filter: none !important; }
      .rep-header::before { background: linear-gradient(90deg, #2563eb, #7c3aed, #16a34a) !important; }
      .rep-h1 { color: #0f172a !important; }
      .rep-h1-sub, .rep-meta, .rep-ssub { color: #475569 !important; }
      .rep-section { background: #fff !important; border: 1px solid #e2e8f0 !important; backdrop-filter: none !important; break-inside: avoid; }
      .rep-shead { border-bottom: 1px solid #e2e8f0 !important; }
      .rep-stitle { color: #0f172a !important; }
      .rep-stat { background: #f8fafc !important; border: 1px solid #e2e8f0 !important; }
      .rep-stat-lbl { color: #64748b !important; }
      .rep-stat-val { color: #0f172a !important; }
      .rep-stat-sub { color: #475569 !important; }
      .rep-table thead tr { background: #f1f5f9 !important; }
      .rep-table thead th { color: #475569 !important; border-color: #e2e8f0 !important; }
      .rep-table tbody td { color: #0f172a !important; border-color: #e2e8f0 !important; }
      .rep-rec { background: #f8fafc !important; }
      .rep-rec.good { border-color: #16a34a !important; color: #15803d !important; }
      .rep-rec.warn { border-color: #d97706 !important; color: #92400e !important; }
      .rep-rec.info { border-color: #2563eb !important; color: #1e40af !important; }
      .rep-rec.danger { border-color: #dc2626 !important; color: #991b1b !important; }
      .rep-conclusion { background: #f0f9ff !important; border-color: #93c5fd !important; color: #334155 !important; }
      .rep-conclusion strong { color: #0f172a !important; }
      .rep-empty { color: #64748b !important; }
      .rep-empty-title { color: #0f172a !important; }
      .rep-stat.good { border-left-color: #16a34a !important; }
      .rep-stat.warn { border-left-color: #d97706 !important; }
      .rep-stat.danger { border-left-color: #dc2626 !important; }
      .rep-ooc-bad { color: #dc2626 !important; }
      .rep-ooc-ok  { color: #16a34a !important; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="top-bar">
      <div>
        <div class="top-bar-title">Informes de Análisis</div>
        <span class="top-bar-breadcrumb">
          Reportes sustanciales — Fase I, Fase II y Planes de Muestreo
        </span>
      </div>
      <div class="top-bar-right">
        <span class="sub-badge" id="sub-status-badge">...</span>
      </div>
    </div>

    <div class="page-content">

      <!-- ══ CONTROLES ══════════════════════════════════════════ -->
      <div class="card" style="margin-bottom:20px">
        <div class="card-header">
          <div class="card-title">Generar Informe</div>
          <span style="font-size:11px;color:var(--text-muted)">
            Selecciona un proceso y las secciones a incluir
          </span>
        </div>
        <div style="padding:14px 20px">
          <div class="rep-controls">
            <select id="proc-sel" class="cfg-input rep-proc-sel" onchange="loadProcess()">
              <option value="">— Selecciona un proceso —</option>
            </select>
            <div class="phase-tabs">
              <button class="phase-tab active" data-phase="all" onclick="setPhase('all')">Completo</button>
              <button class="phase-tab" data-phase="fase1" onclick="setPhase('fase1')">Fase I</button>
              <button class="phase-tab" data-phase="fase2" onclick="setPhase('fase2')">Fase II</button>
              <button class="phase-tab" data-phase="muestreo" onclick="setPhase('muestreo')">Muestreo</button>
            </div>
            <button class="btn btn-primary btn-print" onclick="downloadPDF()" id="btn-print" disabled>
              📄 Guardar PDF
            </button>
          </div>
        </div>
      </div>

      <!-- ══ CONTENIDO DEL INFORME ══════════════════════════════ -->
      <div id="report-content">

        <div class="rep-empty">
          <div class="rep-empty-icon">📊</div>
          <div class="rep-empty-title">Selecciona un proceso</div>
          <div class="rep-empty-sub">Elige un proceso arriba para generar un informe sustancial con análisis completo.</div>
        </div>

      </div>

    </div>
  </div>

<script src="/js/config.js?v=2"></script>
<script src="/js/api.js?v=2"></script>
<script>
if (!requireLogin()) {}
initSidebar('report');
initTopBar('Informes de Análisis');

/* ══════════════════════════════════════════════════════════════
   ESTADO
══════════════════════════════════════════════════════════════ */
let phase        = 'all';
let reportData   = null;
let processName  = '';
let companyName  = '';

/* ══════════════════════════════════════════════════════════════
   INICIALIZACIÓN
══════════════════════════════════════════════════════════════ */
async function init() {
  const list = await processesApi.list().catch(() => []);
  const sel  = document.getElementById('proc-sel');
  list.forEach(p => sel.appendChild(new Option(
    `${p.name}${p.unit ? ' (' + p.unit + ')' : ''}`, p.id
  )));
  const comp = Auth.getCompany();
  companyName = comp?.name || 'ControlNow';

  const pid = new URLSearchParams(location.search).get('process_id');
  if (pid) { sel.value = pid; await loadProcess(); }
}

/* ══════════════════════════════════════════════════════════════
   CAMBIAR FASE
══════════════════════════════════════════════════════════════ */
function setPhase(p) {
  phase = p;
  document.querySelectorAll('.phase-tab').forEach(el => el.classList.toggle('active', el.dataset.phase === p));
  if (reportData) renderReport();
}

/* ══════════════════════════════════════════════════════════════
   CARGAR PROCESO
══════════════════════════════════════════════════════════════ */
async function loadProcess() {
  const pid = document.getElementById('proc-sel').value;
  if (!pid) {
    document.getElementById('report-content').innerHTML = `
      <div class="rep-empty">
        <div class="rep-empty-icon">📊</div>
        <div class="rep-empty-title">Selecciona un proceso</div>
        <div class="rep-empty-sub">Elige un proceso arriba para generar un informe sustancial.</div>
      </div>`;
    document.getElementById('btn-print').disabled = true;
    return;
  }

  document.getElementById('report-content').innerHTML = `
    <div class="rep-empty">
      <div class="rep-empty-icon">⏳</div>
      <div class="rep-empty-title">Generando informe...</div>
      <div class="rep-empty-sub">Consultando datos de análisis de Fase I, Fase II y muestreo.</div>
    </div>`;

  try {
    // Fetch process info first
    const proc = await processesApi.get(pid);
    processName = proc.name;

    // Fetch all analysis data in parallel
    const [reportRes, monitoringData] = await Promise.all([
      apiFetch(`/analysis/report?process_id=${pid}`).catch(() => null),
      // Try loading Phase 2 cache from localStorage (any chart type)
      Promise.resolve().then(() => {
        const chartTypes = ['xbar_r', 'xbar_s', 'p', 'np', 'c', 'u'];
        for (const ct of chartTypes) {
          try {
            const raw = localStorage.getItem(`spc_p2_${pid}_${ct}`);
            if (raw) return JSON.parse(raw);
          } catch {}
        }
        return null;
      })
    ]);

    if (!reportRes) {
      document.getElementById('report-content').innerHTML = `
        <div class="rep-empty">
          <div class="rep-empty-icon">⚠️</div>
          <div class="rep-empty-title">Sin datos disponibles</div>
          <div class="rep-empty-sub">El proceso no tiene datos de Fase I. Ingresa mediciones en Cartas de Control primero.</div>
        </div>`;
      document.getElementById('btn-print').disabled = true;
      return;
    }

    reportData = { process: reportRes, monitoring: monitoringData };
    document.getElementById('btn-print').disabled = false;
    renderReport();

  } catch (err) {
    document.getElementById('report-content').innerHTML = `
      <div class="rep-empty">
        <div class="rep-empty-icon">❌</div>
        <div class="rep-empty-title">Error al generar informe</div>
        <div class="rep-empty-sub">${escHtml(err.message)}</div>
      </div>`;
    document.getElementById('btn-print').disabled = true;
  }
}

/* ══════════════════════════════════════════════════════════════
   ANÁLISIS — FUNCIONES AUXILIARES
══════════════════════════════════════════════════════════════ */
/* ── Helper: normal CDF (Hart / Hastings) ────────────────── */
function normalCDF(x) {
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sign = x < 0 ? -1 : 1;
  const t = 1 / (1 + p * Math.abs(x));
  const y = 1 - (((((a5*t + a4)*t + a3)*t + a2)*t + a1)*t * Math.exp(-x*x/2));
  return 0.5 * (1 + sign * y);
}

/* ── Potencia de detección para carta X̄ con límites ±3σ ──── */
function detectionPower(shiftSigma) {
  const d = Math.abs(shiftSigma);
  return Math.min(1, (1 - normalCDF(3 - d)) + normalCDF(-3 - d));
}

function stabilityAnalysis(cc) {
  if (!cc) return { level: 'unknown', label: 'Sin datos', color: 'info', text: '' };
  if (cc.oocCount === 0 && cc.totalSubgroups >= 20)
    return { level: 'stable', label: 'Estable', color: 'good', text: 'El proceso opera dentro de los límites de control sin señales especiales. La variabilidad es atribuible a causas comunes únicamente.' };
  if (cc.oocCount === 0 && cc.totalSubgroups >= 2)
    return { level: 'incipient', label: 'Preliminar', color: 'info', text: 'No se detectan puntos fuera de control, pero el número de subgrupos es aún limitado para confirmar estabilidad definitiva.' };
  if (cc.oocCount <= 3)
    return { level: 'marginal', label: 'Marginalmente estable', color: 'warn', text: `Se detectaron ${cc.oocCount} punto${cc.oocCount>1?'s':''} fuera de control (${cc.summary.oocRate}%). Aunque la mayoría de los puntos están dentro de límites, las señales especiales requieren investigación.` };
  return { level: 'unstable', label: 'Inestable', color: 'danger', text: `Se detectaron ${cc.oocCount} puntos fuera de control (${cc.summary.oocRate}%). El proceso presenta causas asignables que deben identificarse y eliminarse antes de establecer límites definitivos.` };
}

function violationSummary(violations) {
  if (!violations || !violations.length) return [];
  const seen = new Set();
  return violations.reduce((acc, v) => {
    if (seen.has(v.rule)) return acc;
    seen.add(v.rule);
    const map = { ooc: { label: 'Puntos fuera de límites', detail: 'Uno o más puntos superan las bandas de ±3σ (Regla 1 de Nelson).' }, trend: { label: 'Tendencia', detail: '6+ puntos consecutivos en tendencia monótona (Regla 3 de Nelson).' }, shift: { label: 'Desplazamiento', detail: '8+ puntos consecutivos al mismo lado de la línea central (Regla 2 de Nelson).' } };
    const info = map[v.rule] || { label: v.rule, detail: v.description };
    acc.push(info);
    return acc;
  }, []);
}

function cpkInterpretation(v) {
  if (v == null) return { level: 'unknown', label: 'Sin datos' };
  if (v >= 2.0) return { level: 'excelente', label: 'Excelente', color: 'good' };
  if (v >= 1.67) return { level: 'bueno', label: 'Bueno', color: 'good' };
  if (v >= 1.33) return { level: 'aceptable', label: 'Aceptable', color: 'good' };
  if (v >= 1.0) return { level: 'marginal', label: 'Marginal', color: 'warn' };
  if (v >= 0.67) return { level: 'pobre', label: 'Pobre', color: 'danger' };
  return { level: 'inaceptable', label: 'Inaceptable', color: 'danger' };
}

function riskLevel(cap) {
  if (!cap) return { label: 'Sin datos', color: 'info', text: 'No hay datos de capacidad para evaluar el riesgo.' };
  const cpk = cap.cpk;
  if (cpk >= 1.33) return { label: 'Muy bajo', color: 'good', text: 'Riesgo mínimo: el proceso es capaz (Cpk ≥ 1.33).' };
  if (cpk >= 1.0) return { label: 'Moderado', color: 'warn', text: `Riesgo moderado: proceso marginalmente capaz (Cpk = ${cpk.toFixed(3)}). Se recomienda monitoreo continuo.` };
  return { label: 'Alto', color: 'danger', text: `Riesgo alto: proceso no capaz (Cpk = ${cpk.toFixed(3)}). Se requieren acciones correctivas.` };
}

function crossAnalysis(d) {
  const recs = [];
  const cap = d.capability;
  const cc = d.controlChart;
  const st = d.statisticalTests;
  const isNormal = st?.normality?.normal;
  const isStable = cc && cc.oocCount === 0;
  const isCapable = cap && cap.cpk >= 1.33;
  const isMarginal = cap && cap.cpk >= 1.0 && cap.cpk < 1.33;

  if (isStable && isCapable) recs.push({ prio: 'low', text: 'El proceso es estable y capaz. Mantener monitoreo de rutina y considerar reducir frecuencia de muestreo.' });
  if (isStable && isMarginal) recs.push({ prio: 'med', text: 'Proceso estable pero marginalmente capaz. Reducir variabilidad común (menor σ) o centrar la media hacia el nominal.' });
  if (isStable && cap && cap.cpk < 1.0) recs.push({ prio: 'high', text: 'Proceso estable pero no capaz. Urgente: reducir variabilidad o ajustar media. Evaluar tolerancias de especificación.' });
  if (!isStable && cap) recs.push({ prio: 'high', text: 'Proceso inestable — los índices de capacidad no son fiables. Primero estabilizar el proceso eliminando causas asignables, luego recalcular capacidad.' });
  if (isNormal === false) recs.push({ prio: 'med', text: 'Los datos no son normales. Los índices Cp/Cpk asumen normalidad — considerar transformación Box-Cox o usar índices no paramétricos. Verificar histograma para identificar asimetría o valores atípicos.' });
  if (cap && cap.cpk < cap.cp - 0.1) recs.push({ prio: 'high', text: `Diferencia significativa entre Cp (${fmt(cap.cp)}) y Cpk (${fmt(cap.cpk)}). El proceso está descentrado: ajustar la media hacia el nominal para mejorar capacidad real.` });
  if (cc && cc.totalSubgroups < 20 && cc.oocCount === 0) recs.push({ prio: 'low', text: `Solo ${cc.totalSubgroups} subgrupos disponibles. Para una validación robusta de estabilidad se recomiendan ≥ 20 subgrupos.` });
  if (cap && cap.cpk < 1.0) recs.push({ prio: 'high', text: 'El proceso no es capaz (Cpk < 1.0). Implementar mejora continua para reducir variabilidad.' });
  if (cap && cap.distToNominal != null && cap.distToNominal > cap.tolerance * 0.15) recs.push({ prio: 'med', text: `La media está a ${fmt(cap.distToNominal)} del nominal (tolerancia: ${fmt(cap.tolerance)}). Centrar el proceso para maximizar Cpk.` });

  return recs;
}

/* ══════════════════════════════════════════════════════════════
   RENDERIZAR INFORME
══════════════════════════════════════════════════════════════ */
function renderReport() {
  const d = reportData.process;
  if (!d) return;

  const now = new Date().toLocaleDateString('es-MX', {
    day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });

  const showFase1   = phase === 'all' || phase === 'fase1';
  const showFase2   = phase === 'all' || phase === 'fase2';
  const showMuestreo = phase === 'all' || phase === 'muestreo';

    // Ensure sessionMeans exists (old cache may lack it)
  const mon = reportData.monitoring;
  if (mon && mon.sessionSubgroups?.length) {
    if (!mon.sessionMeans?.length) {
      mon.sessionMeans = [];
      const sgs = mon.sessionSubgroups;
      const ct = mon.chartType || 'xbar_r';
      const isXbar = ['xbar_r', 'xbar_s'].includes(ct);
      for (const sg of sgs) {
        if (Array.isArray(sg)) {
          mon.sessionMeans.push(sg.reduce((a,b)=>a+b,0) / sg.length);
        } else if (sg && typeof sg === 'object') {
          if (sg.defectives != null && sg.n)       mon.sessionMeans.push(sg.defectives / sg.n);
          else if (sg.count != null && sg.n)       mon.sessionMeans.push(sg.count / sg.n);
          else if (sg.defectives != null)          mon.sessionMeans.push(sg.defectives);
          else if (sg.count != null)               mon.sessionMeans.push(sg.count);
        }
      }
    }
    // Compute OOC for monitoring data from Phase I limits
    if (mon.sessionMeans.length && d.controlChart?.summary) {
      const lims = d.controlChart.summary;
      const ucl = lims.ucl, lcl = lims.lcl;
      if (ucl != null && lcl != null) {
        mon.outOfControl = mon.sessionMeans
          .map((v, i) => (v > ucl || v < lcl) ? i : -1)
          .filter(i => i >= 0);
      }
    }
  }

  const sections = [];
  const _cpk = d.capability?.cpk;
  const cpkCls = _cpk != null ? (_cpk >= 1.33 ? 'good' : _cpk >= 1.0 ? 'warn' : 'danger') : 'info';
  const cpkLbl = _cpk != null ? (_cpk >= 1.33 ? 'Capaz' : _cpk >= 1.0 ? 'Marginal' : 'No capaz') : 'Sin datos';

  // ══ ENCABEZADO ══════════════════════════════════════════════
  sections.push(`
    <div class="rep-header">
      <div class="rep-h1">Informe de Análisis Estadístico</div>
      <div class="rep-h1-sub">${escHtml(companyName)} — ${escHtml(d.process.name)}</div>
      <div class="rep-meta">
        <span>📅 ${now}</span>
        <span>📋 ${d.process.chartType ? chartLabel(d.process.chartType) : '—'}</span>
        <span>📏 ${d.dataSummary.n} mediciones</span>
        ${d.process.unit ? `<span>📐 ${escHtml(d.process.unit)}</span>` : ''}
      </div>
    </div>`);

  // ══ FASE I — RESUMEN DE DATOS ═══════════════════════════════
  if (showFase1 && d.dataSummary) {
    const ds = d.dataSummary;
    const capable = d.capability;
    const hasSpecs = d.process.usl != null && d.process.lsl != null;

    sections.push(`<div class="rep-section">
      <div class="rep-shead"><span class="ico">📈</span><span class="rep-stitle">Fase I — Estabilización</span>
      <span class="rep-ssub">${ds.n} mediciones · ${hasSpecs ? 'LSE='+fmt(d.process.usl)+' LSI='+fmt(d.process.lsl) : 'Sin especificaciones'}</span></div>
      <div class="rep-body">

        <div class="rep-grid wide" style="margin-bottom:12px">
          <div class="rep-stat"><div class="rep-stat-lbl">n — Mediciones</div>
            <div class="rep-stat-val">${ds.n}</div><div class="rep-stat-sub">tamaño de muestra</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Media (X̄)</div>
            <div class="rep-stat-val">${fmt(ds.mean)}</div><div class="rep-stat-sub">promedio general</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Desv. Estándar (σ̂)</div>
            <div class="rep-stat-val">${fmt(ds.stdDev)}</div>
            <div class="rep-stat-sub">${capable?.sigmaMethod === 'sbar_c4' ? 'σ̂ = S̄/c₄ (dentro subgrupos)' : capable?.sigmaMethod === 'rbar_d2' ? 'σ̂ = R̄/d₂ (dentro subgrupos)' : 'desviación estándar muestral'}</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Mínimo</div>
            <div class="rep-stat-val">${fmt(ds.min)}</div><div class="rep-stat-sub">valor mínimo</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Máximo</div>
            <div class="rep-stat-val">${fmt(ds.max)}</div><div class="rep-stat-sub">valor máximo</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Rango</div>
            <div class="rep-stat-val">${fmt(ds.range)}</div><div class="rep-stat-sub">amplitud total</div></div>
        </div>`);

    // ── Control Chart Summary ──
    if (d.controlChart?.summary) {
      const cc = d.controlChart;
      const s  = cc.summary;
      const stbl = stabilityAnalysis(cc);
      const violTypes = violationSummary(cc.violations);
      const oocCls = cc.oocCount === 0 ? 'rep-ooc-ok' : 'rep-ooc-bad';
      const oocTxt = cc.oocCount === 0 ? 'Proceso en control estadístico' : `${cc.oocCount} punto${cc.oocCount>1?'s':''} fuera de control (${s.oocRate}%)`;
      sections.push(`
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin:16px 0 8px">Carta de Control — ${chartLabel(d.process.chartType)}</div>
        <div class="rep-grid">
          <div class="rep-stat"><div class="rep-stat-lbl">LCS — Límite Superior</div>
            <div class="rep-stat-val">${fmt(s.ucl)}</div><div class="rep-stat-sub">+3σ sobre la línea central</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">LC — Línea Central</div>
            <div class="rep-stat-val">${fmt(s.cl)}</div><div class="rep-stat-sub">media de los subgrupos</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">LCI — Límite Inferior</div>
            <div class="rep-stat-val">${fmt(s.lcl)}</div><div class="rep-stat-sub">−3σ bajo la línea central</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Subgrupos</div>
            <div class="rep-stat-val">${cc.totalSubgroups}</div><div class="rep-stat-sub">totales analizados</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Media de puntos</div>
            <div class="rep-stat-val">${fmt(s.mean)}</div><div class="rep-stat-sub">promedio de los subgrupos</div></div>
          <div class="rep-stat ${oocCls}"><div class="rep-stat-lbl">Estado</div>
            <div class="rep-stat-val" style="font-size:16px">${oocTxt}</div></div>
        </div>
        <div class="rep-analysis">
          <span class="tag ${stbl.color}">${stbl.label}</span>
          <strong>Análisis de estabilidad:</strong> ${stbl.text}
          ${cc.totalSubgroups < 10 ? ' El número reducido de subgrupos limita la potencia de las pruebas de estabilidad.' : ''}
          ${cc.totalSubgroups >= 25 ? ' Con ≥25 subgrupos, la estimación de los límites de control es robusta.' : ''}
        </div>
        ${violTypes.length ? `<div class="rep-rec-box">
          <div class="rep-rec-box-title">⚠ Reglas de control violadas</div>
          ${violTypes.map(v => `<div class="rep-rec-item"><span class="prio warn">Activa</span><span class="desc"><strong>${v.label}:</strong> ${v.detail}</span></div>`).join('')}
        </div>` : ''}`);
    }

    // ── Capability ──
    if (d.capability) {
      const cap = d.capability;
      const risk = riskLevel(cap);
      const cpkInfo = cpkInterpretation(cap.cpk);
      const isOffCenter = cap.cpk < cap.cp - 0.05;
      sections.push(`
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin:16px 0 8px">Análisis de Capacidad</div>
        <div class="rep-grid">
          <div class="rep-stat ${cpkCls}"><div class="rep-stat-lbl">Cp — Potencial</div>
            <div class="rep-stat-val">${fmt(cap.cp)}</div><div class="rep-stat-sub">capacidad si el proceso estuviera centrado</div></div>
          <div class="rep-stat ${cpkCls}"><div class="rep-stat-lbl">Cpk — Real</div>
            <div class="rep-stat-val">${fmt(cap.cpk)}</div><div class="rep-stat-sub">capacidad real (${cpkInfo.label})</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Cpu / Cpl</div>
            <div class="rep-stat-val">${fmt(cap.cpu)} / ${fmt(cap.cpl)}</div><div class="rep-stat-sub">índices unilateral superior / inferior</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">σ — Variabilidad</div>
            <div class="rep-stat-val">${fmt(cap.sigma)}</div><div class="rep-stat-sub">desviación estándar estimada</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Tolerancia</div>
            <div class="rep-stat-val">${fmt(cap.tolerance)}</div><div class="rep-stat-sub">LSE − LSI (${d.process.usl}, ${d.process.lsl})</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Distancia a LSE</div>
            <div class="rep-stat-val">${fmt(cap.distToUsl)}</div><div class="rep-stat-sub">media − LSE</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Distancia a LSI</div>
            <div class="rep-stat-val">${fmt(cap.distToLsl)}</div><div class="rep-stat-sub">media − LSI</div></div>
          ${cap.distToNominal != null ? `<div class="rep-stat"><div class="rep-stat-lbl">Descentrado</div>
            <div class="rep-stat-val">${fmt(cap.distToNominal)}</div><div class="rep-stat-sub">|media − nominal|</div></div>` : ''}
          <div class="rep-stat"><div class="rep-stat-lbl">Estado</div>
            <div class="rep-stat-val" style="font-size:16px">${cpkLbl}</div></div>
        </div>
        <div class="rep-analysis">
          <span class="tag ${risk.color}">Riesgo ${risk.label}</span>
          <strong>Interpretación:</strong> Cp = ${fmt(cap.cp)} indica la capacidad potencial si el proceso estuviera centrado. Cpk = ${fmt(cap.cpk)} es la capacidad real considerando la ubicación actual de la media.
          ${isOffCenter ? `Hay una diferencia de ${fmt(cap.cp - cap.cpk)} entre Cp y Cpk, lo que sugiere que el proceso está descentrado. ` : 'El proceso está razonablemente centrado. '}
          ${risk.text}
          ${d.statisticalTests?.normality?.available && !d.statisticalTests.normality.normal ? '<br><br>⚠ <strong>Nota:</strong> Los índices de capacidad asumen normalidad. Como los datos no son normales, estos valores deben interpretarse con precaución.' : ''}
        </div>`);
    }

    sections.push(`</div></div>`);
  }

  // ══ FASE I — PRUEBAS ESTADÍSTICAS ══════════════════════════
  if (showFase1 && d.statisticalTests) {
    const st = d.statisticalTests;
    sections.push(`<div class="rep-section">
      <div class="rep-shead"><span class="ico">🔬</span><span class="rep-stitle">Fase I — Pruebas Estadísticas</span>
      <span class="rep-ssub">Normalidad, homogeneidad de varianzas y comparación de grupos</span></div>
      <div class="rep-body">

        <div class="rep-grid">
          <div class="rep-stat ${st.normality?.normal ? 'good' : 'warn'}">
            <div class="rep-stat-lbl">Anderson-Darling (Normalidad)</div>
            <div class="rep-stat-val" style="font-size:16px">${st.normality?.normal ? '✅ Normal' : '⚠ No normal'}</div>
            <div class="rep-stat-sub">A² = ${st.normality?.statistic != null ? st.normality.statistic.toFixed(4) : '—'} · p = ${st.normality?.p_value != null ? st.normality.p_value.toFixed(4) : '—'}</div>
          </div>
          <div class="rep-stat ${st.homoscedasticity?.homoscedastic ? 'good' : 'warn'}">
            <div class="rep-stat-lbl">Levene — Homogeneidad de varianzas</div>
            <div class="rep-stat-val" style="font-size:16px">${st.homoscedasticity?.homoscedastic ? '✅ Varianzas homogéneas' : '⚠ Varianzas heterogéneas'}</div>
            <div class="rep-stat-sub">W = ${st.homoscedasticity?.statistic != null ? st.homoscedasticity.statistic.toFixed(4) : '—'} · p = ${st.homoscedasticity?.p_value != null ? st.homoscedasticity.p_value.toFixed(4) : '—'}</div>
          </div>
          <div class="rep-stat ${st.homogeneity?.homogeneous ? 'good' : 'warn'}">
            <div class="rep-stat-lbl">Kruskal-Wallis — Comparación de grupos</div>
            <div class="rep-stat-val" style="font-size:16px">${st.homogeneity?.homogeneous ? '✅ Grupos homogéneos' : '⚠ Diferencias significativas'}</div>
            <div class="rep-stat-sub">H = ${st.homogeneity?.statistic != null ? st.homogeneity.statistic.toFixed(4) : '—'} · p = ${st.homogeneity?.p_value != null ? st.homogeneity.p_value.toFixed(4) : '—'}</div>
          </div>
        </div>

        <div class="rep-analysis">
          <strong>Interpretación de pruebas:</strong>
          ${st.normality?.available ? `<br>• <strong>Normalidad:</strong> ${st.normality.interpretation}` : '<br>• <strong>Normalidad:</strong> Prueba no disponible.'}
          ${st.homoscedasticity?.available ? `<br>• <strong>Homogeneidad:</strong> ${st.homoscedasticity.interpretation}` : '<br>• <strong>Homogeneidad:</strong> Prueba no disponible (se requieren ≥2 subgrupos con ≥2 obs. cada uno).'}
          ${st.homogeneity?.available ? `<br>• <strong>Grupos:</strong> ${st.homogeneity.interpretation}` : '<br>• <strong>Grupos:</strong> Prueba no disponible (se requieren ≥2 subgrupos).'}
          ${st.normality?.available && !st.normality.normal ? '<br><br>⚠ <strong>Implicación:</strong> La no-normalidad afecta la interpretación de los índices Cp/Cpk (asumen normalidad) y la probabilidad de falsas alarmas en la carta de control. Considere transformar los datos o usar límites de control no paramétricos.' : ''}
          ${st.homoscedasticity?.available && !st.homoscedasticity.homoscedastic ? '<br>⚠ <strong>Implicación:</strong> Varianzas heterogéneas entre subgrupos sugieren que la variabilidad del proceso no es constante. Los límites de control calculados con σ global pueden no ser apropiados para todos los subgrupos.' : ''}
        </div>

      </div></div>`);
  }

  // ══ FASE I — HISTOGRAMA ════════════════════════════════════
  if (showFase1 && d.histogram) {
    const h = d.histogram;
    if (h.labels && h.midpoints) {
      const freqs = h.frequencies;
      const total = freqs.reduce((a, b) => a + b, 0);
      const maxFreqIdx = freqs.indexOf(Math.max(...freqs));
      const asymmetry = maxFreqIdx < freqs.length / 2 - 1 ? 'Los datos se concentran hacia el límite inferior (sesgo izquierdo).' : maxFreqIdx > freqs.length / 2 + 1 ? 'Los datos se concentran hacia el límite superior (sesgo derecho).' : 'Los datos presentan una distribución relativamente simétrica.';
      const hasGaps = freqs.filter(f => f === 0).length > freqs.length * 0.3;
      const totalPct = total > 0 ? 100 : 0;
      sections.push(`<div class="rep-section">
        <div class="rep-shead"><span class="ico">📊</span><span class="rep-stitle">Fase I — Histograma</span>
        <span class="rep-ssub">${h.labels.length} intervalos · rango [${fmt(h.min)}, ${fmt(h.max)}]</span></div>
        <div class="rep-body">

          <div class="rep-table-wrap">
            <table class="rep-table">
              <thead><tr><th>Intervalo</th><th>Frecuencia</th><th>%</th></tr></thead>
              <tbody>
                ${h.midpoints.map((m, i) => {
                  const binW = h.binWidth || 0;
                  const lo = (m - binW/2).toFixed(3);
                  const hi = (m + binW/2).toFixed(3);
                  const freq = freqs[i] || 0;
                  const pct = total > 0 ? (freq / total * 100).toFixed(1) : '0.0';
                  const pctBar = total > 0 ? Math.round(freq / total * 20) : 0;
                  return `<tr><td>${lo} — ${hi}</td><td>${freq}</td><td>${pct}% <span style="display:inline-block;width:${pctBar*2}px;height:8px;background:var(--primary);border-radius:4px;vertical-align:middle;margin-left:4px"></span></td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>

          <div class="rep-analysis">
            <strong>Análisis de distribución:</strong><br>
            • ${asymmetry}
            ${hasGaps ? '<br>• Se observan intervalos con frecuencia cero — posible estratificación o datos faltantes entre ciertos rangos.' : ''}
            ${h.binWidth > 0 ? `<br>• Ancho de intervalo: ${fmt(h.binWidth)}. ${freqs.length < 8 ? 'El número reducido de intervalos puede ocultar detalles de la distribución.' : freqs.length > 20 ? 'El número elevado de intervalos puede generar ruido visual.' : 'El número de intervalos es adecuado para visualizar la distribución.'}` : ''}
            ${d.process.usl != null && d.process.lsl != null ? `<br>• Límites de especificación: LSI=${fmt(d.process.lsl)}, LSE=${fmt(d.process.usl)}. ${h.max > d.process.usl ? '⚠ Hay datos que superan el LSE.' : ''} ${h.min < d.process.lsl ? '⚠ Hay datos por debajo del LSI.' : ''}` : ''}
          </div>

        </div></div>`);
    }
  }

  // ══ FASE I — EVALUACIÓN INTEGRAL Y RECOMENDACIONES ═══════
  if (showFase1 && (d.capability || d.controlChart || d.statisticalTests)) {
    const cap = d.capability;
    const cc = d.controlChart;
    const st = d.statisticalTests;
    const stab = stabilityAnalysis(cc);
    const isStable = cc && cc.oocCount === 0;
    const isCapable = cap && cap.cpk >= 1.33;
    const isMarginal = cap && cap.cpk >= 1.0 && cap.cpk < 1.33;
    const isNormal = st?.normality?.available ? st.normality.normal : null;
    const recs = crossAnalysis(d);
    const risk = riskLevel(cap);

    let matrixCls, matrixLbl, matrixDetail;
    if (isStable && isCapable) { matrixCls = 'good'; matrixLbl = '✅ ESTABLE Y CAPAZ'; matrixDetail = 'El proceso cumple con los requisitos de estabilidad y capacidad. Ideal para producción sostenible.'; }
    else if (isStable && isMarginal) { matrixCls = 'warn'; matrixLbl = '⚠ ESTABLE PERO MARGINAL'; matrixDetail = 'El proceso es estable pero la capacidad es marginal. Requiere monitoreo continuo y acciones de mejora para alcanzar Cpk ≥ 1.33.'; }
    else if (isStable && cap && cap.cpk < 1.0) { matrixCls = 'danger'; matrixLbl = '❌ ESTABLE PERO NO CAPAZ'; matrixDetail = 'Proceso estable pero incapaz de producir dentro de especificaciones. Urgente reducir variabilidad o ajustar tolerancias.'; }
    else if (!isStable && cap && isCapable) { matrixCls = 'warn'; matrixLbl = '⚠ INESTABLE PERO CAPAZ'; matrixDetail = 'Aunque los índices de capacidad son buenos, la inestabilidad invalida su interpretación. Primero estabilizar el proceso.'; }
    else if (!isStable && cap && isMarginal) { matrixCls = 'danger'; matrixLbl = '❌ INESTABLE Y MARGINAL'; matrixDetail = 'El proceso es inestable y marginalmente capaz. Abordar causas asignables y luego mejorar capacidad.'; }
    else if (!isStable && cap) { matrixCls = 'danger'; matrixLbl = '❌ INESTABLE Y NO CAPAZ'; matrixDetail = 'Situación crítica: inestable e incapaz. Detener producción si es posible, identificar causas asignables, reducir variabilidad.'; }
    else if (!cc && cap) { matrixCls = 'info'; matrixLbl = 'ℹ SIN CARTA DE CONTROL'; matrixDetail = 'No hay datos de carta de control para evaluar estabilidad. La capacidad se calculó sobre datos agrupados.'; }
    else { matrixCls = 'info'; matrixLbl = 'ℹ DATOS INSUFICIENTES'; matrixDetail = 'No hay suficientes datos de Fase I para una evaluación integral.'; }

    sections.push(`<div class="rep-section">
      <div class="rep-shead"><span class="ico">🎯</span><span class="rep-stitle">Evaluación Integral</span>
      <span class="rep-ssub">Diagnóstico cruzado de estabilidad, capacidad y pruebas estadísticas</span></div>
      <div class="rep-body">

        <div class="rep-grid">
          <div class="rep-stat ${stab.color}"><div class="rep-stat-lbl">Estabilidad</div>
            <div class="rep-stat-val" style="font-size:16px">${stab.label}</div>
            <div class="rep-stat-sub">${cc ? cc.totalSubgroups + ' subgrupos analizados' : 'No evaluado'}</div></div>
          <div class="rep-stat ${cpkCls}"><div class="rep-stat-lbl">Capacidad (Cpk)</div>
            <div class="rep-stat-val" style="font-size:16px">${cap ? fmt(cap.cpk) : '—'}</div>
            <div class="rep-stat-sub">${cpkLbl}</div></div>
          <div class="rep-stat ${isNormal === true ? 'good' : isNormal === false ? 'warn' : 'info'}"><div class="rep-stat-lbl">Normalidad</div>
            <div class="rep-stat-val" style="font-size:16px">${isNormal === true ? '✅ Normal' : isNormal === false ? '⚠ No normal' : '—'}</div>
            <div class="rep-stat-sub">Anderson-Darling</div></div>
          <div class="rep-stat ${risk.color}"><div class="rep-stat-lbl">Riesgo de defectos</div>
            <div class="rep-stat-val" style="font-size:16px">${risk.label}</div>
            <div class="rep-stat-sub">${cap && cap.cpk < 1.0 ? 'Proceso no capaz' : cap ? 'Proceso capaz' : '—'}</div></div>
        </div>

        <div class="rep-analysis" style="border-left-color: ${matrixCls === 'good' ? 'var(--success)' : matrixCls === 'warn' ? 'var(--warning)' : matrixCls === 'danger' ? 'var(--danger)' : 'var(--primary)'}">
          <span class="tag ${matrixCls}">${matrixLbl}</span>
          <strong>Diagnóstico integral:</strong> ${matrixDetail}
          ${isNormal === false ? ' La no-normalidad añade incertidumbre a los índices de capacidad.' : ''}
          ${cap && cap.cp > 1.67 ? ' La capacidad potencial (Cp) es excelente, lo que indica que hay oportunidad de mejorar la capacidad real centrando el proceso.' : ''}
        </div>

        ${recs.length ? `<div class="rep-rec-box">
          <div class="rep-rec-box-title">📋 Recomendaciones priorizadas</div>
          ${recs.map(r => `<div class="rep-rec-item"><span class="prio ${r.prio}">${r.prio === 'high' ? 'Alta' : r.prio === 'med' ? 'Media' : 'Baja'}</span><span class="desc">${r.text}</span></div>`).join('')}
        </div>` : ''}

      </div></div>`);
  }

  // ══ FASE II — MONITOREO ═══════════════════════════════════
  if (showFase2) {
    const mon = reportData.monitoring;
    sections.push(`<div class="rep-section">
      <div class="rep-shead"><span class="ico">📋</span><span class="rep-stitle">Fase II — Monitoreo SPC</span>
      <span class="rep-ssub">Sesión de monitoreo en tiempo real</span></div>
      <div class="rep-body">`);

    if (mon && mon.sessionSubgroups?.length > 0) {
      const sg = mon.sessionSubgroups;
      const means = mon.sessionMeans || [];
      const meanVal = means.length ? means.reduce((a,b)=>a+b,0)/means.length : null;
      const ccSummary = d.controlChart?.summary;
      const mu0 = ccSummary?.cl;
      const sigmaXbar = ccSummary && ccSummary.ucl != null && ccSummary.cl != null
        ? (ccSummary.ucl - ccSummary.cl) / 3 : null;
      const monShift = sigmaXbar > 0 && meanVal != null && mu0 != null
        ? (meanVal - mu0) / sigmaXbar : null;

      // Performance evaluation
      const nSize = d.process?.nSize ? parseInt(d.process.nSize) : null;
      const processSigma = sigmaXbar > 0 && nSize > 0 ? sigmaXbar * Math.sqrt(nSize) : null;
      const shiftProcess = processSigma > 0 && meanVal != null && mu0 != null
        ? (meanVal - mu0) / processSigma : null;
      const usl = d.process?.usl != null ? parseFloat(d.process.usl) : null;
      const lsl = d.process?.lsl != null ? parseFloat(d.process.lsl) : null;
      const pnc0 = null;
      let pnc1 = null;
      if (processSigma > 0 && usl != null && lsl != null && meanVal != null) {
        const zLsl = (lsl - meanVal) / processSigma;
        const zUsl = (usl - meanVal) / processSigma;
        pnc1 = (normalCDF(zLsl) + (1 - normalCDF(zUsl))) * 100;
      }

      const deltaPnc = pnc0 != null && pnc1 != null ? pnc1 - pnc0 : null;

      sections.push(`
        <div class="rep-grid">
          <div class="rep-stat"><div class="rep-stat-lbl">Subgrupos en Fase II</div>
            <div class="rep-stat-val">${sg.length}</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">n (tamaño subgrupo)</div>
            <div class="rep-stat-val">${nSize || '—'}</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Media Fase I (μ₀)</div>
            <div class="rep-stat-val">${mu0 != null ? fmt(mu0) : '—'}</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Media Fase II (μ₁)</div>
            <div class="rep-stat-val">${meanVal != null ? fmt(meanVal) : '—'}</div></div>
          <div class="rep-stat" style="grid-column:span 1"><div class="rep-stat-lbl">Desplazamiento (σ proceso)</div>
            <div class="rep-stat-val" style="${shiftProcess != null && Math.abs(shiftProcess) > 0.5 ? 'color:var(--danger);font-weight:700' : ''}">${shiftProcess != null ? `${shiftProcess >= 0 ? '+' : ''}${shiftProcess.toFixed(4)}σ` : '—'}</div>
            <div class="rep-stat-sub">X̄: ${monShift != null ? `${monShift >= 0 ? '+' : ''}${monShift.toFixed(2)}σ` : '—'} · n=${nSize || '?'}</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">%PNC original (μ₀)</div>
            <div class="rep-stat-val">${pnc0 != null ? pnc0.toFixed(4) + '%' : '—'}</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">%PNC recalculado (μ₁)</div>
            <div class="rep-stat-val" style="font-weight:700">${pnc1 != null ? pnc1.toFixed(4) + '%' : '—'}</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Δ%PNC</div>
            <div class="rep-stat-val" style="color:${deltaPnc > 0 ? 'var(--danger)' : deltaPnc < 0 ? 'var(--success)' : 'inherit'}">${deltaPnc != null ? `${deltaPnc >= 0 ? '+' : ''}${deltaPnc.toFixed(4)} pp` : '—'}</div></div>
          <div class="rep-stat"><div class="rep-stat-lbl">Potencia detección</div>
            <div class="rep-stat-val">${monShift != null ? (detectionPower(monShift) * 100).toFixed(1) + '%' : '—'}</div>
            <div class="rep-stat-sub">ARL: ${monShift != null ? detectionPower(monShift) > 0 ? (1/detectionPower(monShift)).toFixed(1) : '∞' : ''}</div></div>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-sec);line-height:1.6">
          La sesión de monitoreo registró <strong>${sg.length}</strong> subgrupos (n=${nSize || '?'}) en Fase II.
          ${mu0 != null && meanVal != null ? `La media pasó de <strong>${fmt(mu0)}</strong> (Fase I) a <strong>${fmt(meanVal)}</strong> (Fase II). ` : ''}
          ${shiftProcess != null ? `Desplazamiento de <strong>${shiftProcess >= 0 ? '+' : ''}${shiftProcess.toFixed(4)}σ</strong> en el proceso. ` : ''}
          ${monShift != null ? `En la carta X̄ equivale a <strong>${monShift >= 0 ? '+' : ''}${monShift.toFixed(2)}σ</strong>. ` : ''}
          ${monShift != null ? `Potencia de detección: <strong>${(detectionPower(monShift) * 100).toFixed(1)}%</strong> (ARL ${detectionPower(monShift) > 0 ? (1/detectionPower(monShift)).toFixed(1) : '∞'}). ` : ''}
          ${pnc0 != null ? `%PNC original: <strong>${pnc0.toFixed(4)}%</strong>. ` : ''}
          ${pnc1 != null ? `%PNC recalculado con la nueva media: <strong>${pnc1.toFixed(4)}%</strong>. ` : ''}
          ${deltaPnc != null ? `Diferencia: <strong style="color:${deltaPnc > 0 ? 'var(--danger)' : 'var(--success)'}">${deltaPnc >= 0 ? '+' : ''}${deltaPnc.toFixed(4)} pp</strong>. ` : ''}
          ${shiftProcess != null && Math.abs(shiftProcess) >= 1.0 ? '⚠ El desplazamiento supera 1σ del proceso, puede indicar un cambio significativo en la calidad del producto.' : shiftProcess != null && Math.abs(shiftProcess) >= 0.5 ? '⚠ El desplazamiento supera 0.5σ del proceso, monitorear tendencia cuidadosamente.' : 'El proceso se mantiene centrado respecto a la referencia de Fase I.'}
        </div>`);

      // Tabla de entradas recientes (últimas 20)
      const logAll = mon.sessionLog || [];
      const recent = logAll.slice(-20);
      if (recent.length) {
        const logLen = logAll.length;
        const recentOffset = logLen - recent.length;
        sections.push(`
          <div class="rep-table-wrap">
            <table class="rep-table">
              <thead><tr><th>#</th><th>Subgrupo</th><th>Valor</th><th>Estado</th></tr></thead>
              <tbody>
                ${recent.map((r, i) => {
                  const origIdx = recentOffset + i;
                  // sessionLog is newest-first (unshift), sessionSubgroups is oldest-first (push).
                  // For recent[i], the matching subgroup is at index (recent.length - 1 - i) in sessionSubgroups.
                  const sgIdx  = recent.length - 1 - i;
                  const sgData = mon.sessionSubgroups?.[sgIdx];
                  const ccSum  = d.controlChart?.summary;
                  let isOoc = false;
                  if (sgData != null && ccSum?.ucl != null && ccSum?.lcl != null) {
                    let statVal = null;
                    if (Array.isArray(sgData))
                      statVal = sgData.reduce((a, b) => a + b, 0) / sgData.length;
                    else if (sgData.defectives != null && sgData.n)
                      statVal = sgData.defectives / sgData.n;
                    else if (sgData.defectives != null)
                      statVal = sgData.defectives;
                    else if (sgData.count != null && sgData.n)
                      statVal = sgData.count / sgData.n;
                    else if (sgData.count != null)
                      statVal = sgData.count;
                    if (statVal != null)
                      isOoc = statVal > ccSum.ucl || statVal < ccSum.lcl;
                  } else {
                    // fallback to pre-computed index (same order as subgroups)
                    isOoc = mon.outOfControl?.includes(sgIdx) ?? false;
                  }
                  const oocTxt = isOoc ? '⚠ Fuera de control' : '✓ En control';
                  const oocCls = isOoc ? 'rep-ooc-bad' : 'rep-ooc-ok';
                  return `<tr>
                    <td>${r.n || origIdx+1}</td>
                    <td>SG #${r.sgId || (origIdx+1)}</td>
                    <td>${escHtml(r.displayVal || '—')}</td>
                    <td class="${oocCls}">${oocTxt}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
          ${recent.length < logLen ? `<div style="margin-top:6px;font-size:11px;color:var(--text-muted)">Mostrando las últimas ${recent.length} entradas de ${logLen}.</div>` : ''}`);
      }
    } else {
      sections.push(`
        <div class="rep-empty" style="padding:20px">
          <div class="rep-empty-title" style="font-size:13px">Sin datos de monitoreo</div>
          <div class="rep-empty-sub">No hay sesión de Fase II guardada para este proceso. Inicia un monitoreo en la página correspondiente.</div>
        </div>`);
      }

      // ── Evaluación de Desempeño guardada ──
      try {
        const evalRaw = localStorage.getItem('spc_eval_' + d.process?.id);
        if (evalRaw) {
          const ev = JSON.parse(evalRaw);
          if (ev.mu0 != null && ev.deltaReal != null) {
            const evDate = new Date(ev.savedAt).toLocaleString('es-MX', { dateStyle:'short', timeStyle:'short' });
            const evShiftCls = Math.abs(ev.deltaReal) > 0.5 ? 'color:var(--danger);font-weight:700' : '';
            const p = ev.performance;
            sections.push(`
              <div style="margin-top:16px;padding:14px 18px;background:var(--glass-card);border:1px solid var(--glass-border);border-radius:var(--radius)">
                <div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:10px">📊 Evaluación de Desempeño guardada <span style="font-weight:400;text-transform:none;color:var(--text-sec)">(${evDate})</span></div>
                <div class="rep-grid">
                  <div class="rep-stat"><div class="rep-stat-lbl">μ₀</div><div class="rep-stat-val">${fmt(ev.mu0)}</div></div>
                  <div class="rep-stat"><div class="rep-stat-lbl">μ₁</div><div class="rep-stat-val">${fmt(ev.mu1)}</div></div>
                  <div class="rep-stat"><div class="rep-stat-lbl">δ (σ proceso)</div><div class="rep-stat-val" style="${evShiftCls}">${ev.deltaReal >= 0 ? '+' : ''}${ev.deltaReal.toFixed(4)}σ</div></div>
                  <div class="rep-stat"><div class="rep-stat-lbl">σ̂ proceso</div><div class="rep-stat-val">${fmt(ev.sigmaP)}</div></div>
                  <div class="rep-stat"><div class="rep-stat-lbl">n</div><div class="rep-stat-val">${ev.n}</div></div>
                  <div class="rep-stat"><div class="rep-stat-lbl">Subgrupos</div><div class="rep-stat-val">${ev.sgCount}</div></div>
                  <div class="rep-stat"><div class="rep-stat-lbl">%PNC original</div><div class="rep-stat-val">${ev.pnc0 != null ? (ev.pnc0 * 100).toFixed(4) + '%' : '—'}</div></div>
                  <div class="rep-stat" style="grid-column:span 2"><div class="rep-stat-lbl">%PNC recalculado (μ₁)</div><div class="rep-stat-val" style="font-size:24px;font-weight:900">${ev.pnc1 != null ? (ev.pnc1 * 100).toFixed(4) + '%' : '—'}</div></div>
                </div>
                ${p ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--glass-border)">
                  <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:8px">📈 Desempeño del plan de monitoreo</div>
                  <div class="rep-grid">
                    <div class="rep-stat"><div class="rep-stat-lbl">Configuración</div><div class="rep-stat-val">k=${p.k}σ · n=${p.n} · t=${p.h}h · δ=${p.delta}σ</div></div>
                    <div class="rep-stat"><div class="rep-stat-lbl">%NC real</div><div class="rep-stat-val">${p.rawPnc.toFixed(2)}%</div></div>
                    <div class="rep-stat"><div class="rep-stat-lbl">α (error tipo I)</div><div class="rep-stat-val">${p.alpha < 0.001 ? p.alpha.toExponential(2) : p.alpha.toFixed(4)}</div></div>
                    <div class="rep-stat"><div class="rep-stat-lbl">β (error tipo II)</div><div class="rep-stat-val">${p.beta.toFixed(4)}</div></div>
                    <div class="rep-stat"><div class="rep-stat-lbl">Potencia (1−β)</div><div class="rep-stat-val">${(p.power*100).toFixed(1)}%</div></div>
                    <div class="rep-stat"><div class="rep-stat-lbl">ARL₀</div><div class="rep-stat-val">${fmt(p.arl0)}</div></div>
                    <div class="rep-stat"><div class="rep-stat-lbl">ARL₁</div><div class="rep-stat-val">${fmt(p.arl1)}</div></div>
                    <div class="rep-stat"><div class="rep-stat-lbl">ATS₀</div><div class="rep-stat-val">${p.ats0.toFixed(1)} h</div></div>
                    <div class="rep-stat"><div class="rep-stat-lbl">ATS₁</div><div class="rep-stat-val">${p.ats1.toFixed(1)} h</div></div>
                    <div class="rep-stat" style="grid-column:span 2"><div class="rep-stat-lbl">PPNC</div><div class="rep-stat-val" style="font-size:18px;font-weight:900">${fmt(p.ppnc)} ud</div></div>
                  </div>
                </div>` : ''}
                ${ev.cmPlans ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--glass-border)">
                  <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:8px">⚖️ Carga Muestral — CM objetivo: ${ev.cmPlans.targetCM.toFixed(2)} u/h (Δ=${(ev.cmPlans.pctInc*100).toFixed(0)}%)</div>
                  <div style="display:flex;gap:12px;flex-wrap:wrap">
                    ${['plan1','plan2'].map((key, i) => {
                      const pl = ev.cmPlans[key];
                      if (!pl) return '';
                      const label = i === 0 ? `Plan 1 — misma n (n=${ev.cmPlans.current.n})` : `Plan 2 — mismo t (t=${ev.cmPlans.current.t}h)`;
                      return `<div style="flex:1;min-width:200px;padding:10px 14px;background:var(--glass-card);border:1px solid ${i===0?'var(--success-bdr)':'var(--warning-bdr)'};border-radius:var(--radius)">
                        <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:${i===0?'var(--success)':'var(--warning)'};margin-bottom:6px">${label}</div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px">
                          <span>n = <strong>${Number.isInteger(pl.n) ? pl.n : pl.n.toFixed(2)}</strong></span>
                          <span>t = <strong>${pl.t.toFixed(2)}</strong> h</span>
                          <span>CM = <strong>${pl.cm.toFixed(2)}</strong> u/h</span>
                          <span>ATS₁ = <strong>${pl.ats1.toFixed(1)}</strong> h</span>
                          <span>Potencia = <strong>${(pl.power*100).toFixed(1)}%</strong></span>
                          <span>PPNC = <strong>${fmt(pl.ppnc)}</strong> ud</span>
                        </div>
                      </div>`;
                    }).join('')}
                  </div>
                  ${ev.cmPlans.best ? `
                  <div style="margin-top:8px;padding:8px 12px;background:var(--success-bg);border:1px solid var(--success-bdr);border-radius:var(--radius);font-size:12px">
                    <strong>★ Plan recomendado:</strong> n = ${Number.isInteger(ev.cmPlans.best.n) ? ev.cmPlans.best.n : ev.cmPlans.best.n.toFixed(2)} · t = ${ev.cmPlans.best.t.toFixed(2)} h · CM = ${ev.cmPlans.best.cm.toFixed(2)} · ATS₁ = ${ev.cmPlans.best.ats1.toFixed(1)} h
                  </div>` : ''}
                </div>` : ''}
              </div>`);
          }
        }
      } catch {}

      sections.push(`</div></div>`);
  }

  // ══ PLANES DE MUESTREO ════════════════════════════════════
  if (showMuestreo) {
    sections.push(`<div class="rep-section">
      <div class="rep-shead"><span class="ico">📐</span><span class="rep-stitle">Planes de Muestreo por Atributos</span>
      <span class="rep-ssub">Diseño de plan de aceptación (NCA / NRC)</span></div>
      <div class="rep-body">

        <div class="rep-empty" style="padding:20px">
          <div class="rep-empty-title" style="font-size:13px">Diseño interactivo disponible</div>
          <div class="rep-empty-sub" style="line-height:1.6">
            Los planes de muestreo se diseñan en la página
            <a href="/sampling-plan.html" style="color:var(--primary);font-weight:700">Diseño de Planes</a>.
            Puedes configurar NCA (AQL), NRC (LTPD), riesgos α y β para obtener
            el plan óptimo (n, NAC), curva CO, AOQ y recomendaciones.
            <br><br>
            <strong>Parámetros por defecto:</strong> N=1000, AQL=1%, α=5%, LTPD=5%, β=10%.
            Ajusta según tus necesidades de protección productor/consumidor.
          </div>
        </div>

      </div></div>`);
  }

  // ══ CONCLUSIONES ══════════════════════════════════════════
  if (showFase1) {
    const cap = d.capability;
    const cc = d.controlChart;
    const st = d.statisticalTests;
    const isNormal = st?.normality?.available ? st.normality.normal : null;
    const recs = crossAnalysis(d);
    const highPrio = recs.filter(r => r.prio === 'high');
    const hasHigh = highPrio.length > 0;

    let par1 = '', par2 = '', par3 = '';

    // Párrafo 1: Verdicto general
    if (cap && cc && cc.oocCount === 0 && cap.cpk >= 1.33) {
      par1 = 'El proceso se encuentra en <strong>control estadístico</strong> y es <strong>capaz</strong> (Cpk = ' + fmt(cap.cpk) + '). Está operando dentro de los límites de control y cumple las especificaciones con margen.';
      if (cap.cpk >= 1.67) par1 += ' La capacidad es excelente (Cpk ≥ 1.67), lo que indica un proceso de alta calidad.';
    } else if (cap && cc && cc.oocCount === 0 && cap.cpk >= 1.0) {
      par1 = 'El proceso es <strong>estable</strong> pero su capacidad es <strong>marginal</strong> (Cpk = ' + fmt(cap.cpk) + '). Aunque no hay causas asignables, la variabilidad común es excesiva para las especificaciones actuales.';
    } else if (cap && cc && cc.oocCount === 0 && cap.cpk < 1.0) {
      par1 = 'El proceso es <strong>estable</strong> pero <strong>no es capaz</strong> (Cpk = ' + fmt(cap.cpk) + '). Se requiere acción correctiva para reducir variabilidad o ajustar la media.';
    } else if (cap && cc && cc.oocCount > 0) {
      par1 = 'El proceso presenta <strong>inestabilidad</strong> (' + cc.oocCount + ' punto' + (cc.oocCount > 1 ? 's' : '') + ' fuera de control) y una capacidad ' + (cap.cpk >= 1.33 ? 'aparentemente buena' : cap.cpk >= 1.0 ? 'marginal' : 'insuficiente') + ' (Cpk = ' + fmt(cap.cpk) + '). Los índices de capacidad no son fiables hasta estabilizar el proceso.';
    } else if (cap) {
      par1 = 'No se pudo evaluar la estabilidad por falta de datos de carta de control. La capacidad calculada (Cpk = ' + fmt(cap.cpk) + ') asume que el proceso está estable, lo cual debe verificarse.';
    } else if (cc) {
      par1 = 'No hay límites de especificación definidos, por lo que no se puede calcular la capacidad del proceso. La carta de control muestra un proceso ' + (cc.oocCount === 0 ? 'estable' : 'con señales OOC') + '.';
    } else {
      par1 = 'No hay suficientes datos de Fase I para generar una conclusión sustancial.';
    }

    // Párrafo 2: Análisis de pruebas estadísticas
    if (st) {
      if (isNormal === true) {
        par2 = 'Los datos siguen una distribución normal (Anderson-Darling, p > 0.05), lo que valida el uso de índices Cp/Cpk y la interpretación de la carta de control basada en ±3σ.';
      } else if (isNormal === false) {
        par2 = 'Los datos <strong>no son normales</strong> (Anderson-Darling, p = ' + st.normality.p_value.toFixed(4) + '). Los índices de capacidad deben interpretarse con precaución. Se recomienda transformación Box-Cox o usar técnicas no paramétricas.';
      }
      if (st.homoscedasticity?.available && !st.homoscedasticity?.homoscedastic) {
        par2 += ' Además, las varianzas no son homogéneas entre subgrupos (Levene, p = ' + st.homoscedasticity.p_value.toFixed(4) + '), lo que sugiere que la variabilidad no es constante.';
      }
    }

    // Párrafo 3: Recomendaciones principales y cierre
    if (hasHigh) {
      par3 = '<strong>Acciones prioritarias requeridas:</strong><ul style="margin:6px 0 0 16px;padding:0">';
      highPrio.forEach(r => { par3 += '<li>' + r.text + '</li>'; });
      par3 += '</ul>';
    } else if (cap && cap.cpk >= 1.33 && cc && cc.oocCount === 0) {
      par3 = 'Se recomienda mantener el monitoreo de rutina y proceder a Fase II para vigilancia continua. Considere reducir la frecuencia de muestreo si el proceso se mantiene estable y capaz.';
    } else if (cap && cap.cpk >= 1.0) {
      par3 = 'Se recomienda implementar un plan de mejora enfocado en reducir la variabilidad y/o centrar la media hacia el nominal para alcanzar Cpk ≥ 1.33.';
    }

    const fullConclusion = [par1, par2, par3].filter(Boolean).join('</p><p style="margin-top:8px">');

    sections.push(`
      <div class="rep-conclusion">
        <strong>📌 Conclusión general</strong>
        <p style="margin:6px 0 0">${fullConclusion}</p>
      </div>`);
  }

  document.getElementById('report-content').innerHTML = `
    <div class="report-sections">
      ${sections.join('')}
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   UTILIDADES
══════════════════════════════════════════════════════════════ */
function fmt(v) {
  if (v == null || !isFinite(v)) return '—';
  return Number(v).toFixed(4);
}

const CHART_LABELS = {
  xbar_r: 'X̄-R', xbar_s: 'X̄-S', p: 'Carta p', np: 'Carta np', c: 'Carta c', u: 'Carta u'
};
function chartLabel(t) { return CHART_LABELS[t] || t || '—'; }

/* ══════════════════════════════════════════════════════════════
   EXPORTAR PDF — tema claro mediante onclone de html2canvas
══════════════════════════════════════════════════════════════ */
async function downloadPDF() {
  const btn = document.getElementById('btn-print');
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳ Generando…';

  try {
    if (typeof html2pdf === 'undefined') {
      throw new Error('Librería PDF no cargada. Recarga la página.');
    }

    const element  = document.getElementById('report-content');
    const procName = reportData?.process?.process?.name || 'informe';
    const fecha    = new Date().toISOString().slice(0, 10);
    const fileName = `SPC_${procName.replace(/[^a-z0-9]/gi, '_')}_${fecha}.pdf`;

    await html2pdf()
      .set({
        margin:      [10, 10, 10, 10],
        filename:    fileName,
        image:       { type: 'jpeg', quality: 0.95 },
        html2canvas: {
          scale:           2,
          useCORS:         true,
          logging:         false,
          backgroundColor: '#ffffff',
          onclone: (clonedDoc) => {
            // ── Sobrescribir variables CSS del tema oscuro ──────────────
            const root = clonedDoc.documentElement;
            root.style.setProperty('--bg-1',          '#ffffff');
            root.style.setProperty('--bg-2',          '#f8fafc');
            root.style.setProperty('--bg-3',          '#f1f5f9');
            root.style.setProperty('--bg-accent',     '#2563eb');
            root.style.setProperty('--glass-base',    '#f8fafc');
            root.style.setProperty('--glass-card',    '#f8fafc');
            root.style.setProperty('--glass-card-hov','#f1f5f9');
            root.style.setProperty('--glass-border',  '#e2e8f0');
            root.style.setProperty('--glass-border-hov','#cbd5e1');
            root.style.setProperty('--glass-blur',    'none');
            root.style.setProperty('--glass-blur-lg', 'none');
            root.style.setProperty('--text',          '#0f172a');
            root.style.setProperty('--text-sec',      '#1e293b');
            root.style.setProperty('--text-muted',    '#475569');
            root.style.setProperty('--text-dim',      '#64748b');
            root.style.setProperty('--border',        '#e2e8f0');
            root.style.setProperty('--border-lt',     '#f1f5f9');

            // ── Fondo del body y contenido ──────────────────────────────
            clonedDoc.body.style.background    = '#ffffff';
            clonedDoc.body.style.color         = '#0f172a';
            clonedDoc.body.style.backgroundImage = 'none';

            const content = clonedDoc.getElementById('report-content');
            if (content) {
              content.style.background = '#ffffff';
              content.style.color      = '#0f172a';
            }

            // ── Quitar backdrop-filter (no renderiza en canvas) ─────────
            clonedDoc.querySelectorAll('*').forEach(el => {
              const cs = window.getComputedStyle(el);
              if (cs.backdropFilter !== 'none' || el.style.backdropFilter) {
                el.style.backdropFilter = 'none';
                el.style.webkitBackdropFilter = 'none';
              }
            });
          }
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      })
      .from(element)
      .save();

  } catch (err) {
    console.error('Error generando PDF:', err);
    alert('Error al generar el PDF: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
}

init();
</script>
</body>
</html>
