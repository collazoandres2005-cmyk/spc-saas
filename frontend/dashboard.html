<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control — SPC SaaS</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .page-header {
      border-left: 3px solid var(--primary);
      padding-left: 12px;
      margin-bottom: 20px;
    }
    .page-header h2 { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 2px; }
    .page-header p  { font-size: 12px; color: var(--text-muted); margin: 0; }

    .stat-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .stat-bar { grid-template-columns: 1fr 1fr; gap: 8px; }
    }
    @media (max-width: 340px) {
      .stat-bar { grid-template-columns: 1fr; }
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      min-width: 0;
    }
    .stat-box.accent-primary { border-top-color: var(--primary); }
    .stat-box.accent-success { border-top-color: var(--success); }
    .stat-box.accent-warning { border-top-color: var(--warning); }
    .stat-box.accent-danger  { border-top-color: var(--danger);  }

    .stat-num {
      font-family: var(--font-data);
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      margin-top: 4px;
    }
    @media (max-width: 600px) {
      .stat-num { font-size: 22px; }
      .stat-box { padding: 12px 14px; }
    }
    .stat-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
    }

    .sub-alert {
      background: var(--danger-bg);
      border: 1px solid var(--danger-bdr);
      color: var(--danger);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .sub-alert.warn { background: var(--warning-bg); border-color: var(--warning-bdr); color: var(--warning); }
  </style>
</head>
<body class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="top-bar">
      <div>
        <div class="top-bar-title" id="top-bar-title">Panel de Control</div>
      </div>
      <div class="top-bar-right">
        <span class="sub-badge" id="sub-status-badge">...</span>
      </div>
    </div>

    <div class="page-content">
      <div id="sub-alert-container"></div>

      <div class="page-header">
        <h2>Panel de Control</h2>
        <p>Control estadístico de procesos — resumen de capacidad y estado actual</p>
      </div>

      <!-- KPIs -->
      <div class="stat-bar" id="stat-bar">
        <div class="stat-box accent-primary">
          <div class="stat-lbl">Procesos activos</div>
          <div class="stat-num" id="kpi-processes">—</div>
        </div>
        <div class="stat-box accent-success">
          <div class="stat-lbl">Capaces (Cpk ≥ 1.33)</div>
          <div class="stat-num text-success" id="kpi-capable">—</div>
        </div>
        <div class="stat-box accent-warning">
          <div class="stat-lbl">Marginales (1.0 – 1.33)</div>
          <div class="stat-num text-warning" id="kpi-marginal">—</div>
        </div>
        <div class="stat-box accent-danger">
          <div class="stat-lbl">No capaces (Cpk &lt; 1.0)</div>
          <div class="stat-num text-danger" id="kpi-nocapable">—</div>
        </div>
      </div>

      <!-- Procesos -->
      <div class="toolbar">
        <div class="section-title" style="margin:0;border:0;padding:0">Resumen de procesos</div>
        <div class="toolbar-spacer"></div>
        <a href="/processes.html" class="btn btn-secondary btn-sm">Ver todos los procesos</a>
        <a href="/processes.html" class="btn btn-primary btn-sm">+ Nuevo proceso</a>
      </div>

      <div id="processes-container">
        <div class="loading"><span class="spinner"></span> Cargando procesos...</div>
      </div>
    </div>
  </div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
  if (!requireLogin()) { /* redirected */ }

  initSidebar('dashboard');
  initTopBar('Panel de Control');

  let summariesMap = {};

  // Feature flag — poner en true para reactivar bloqueos de suscripción
  const REQUIRE_SUBSCRIPTION = false;

  async function loadDashboard() {
    const user    = Auth.getUser();
    const company = Auth.getCompany();
    const subData = await billingApi.status().catch(() => null);
    const status  = subData?.subscription_status || company?.subscription_status || 'inactive';

    if (REQUIRE_SUBSCRIPTION) {
      const alertEl = document.getElementById('sub-alert-container');
      if (status === 'inactive') {
        alertEl.innerHTML = `
          <div class="sub-alert">
            <div>
              <strong>Suscripción inactiva.</strong> Para acceder a todos los módulos necesitas una suscripción activa.
              <br><button class="btn btn-danger btn-sm" style="margin-top:8px" onclick="startCheckout()">Activar suscripción</button>
              ${location.hostname === 'localhost' ? '<button class="btn btn-secondary btn-sm" style="margin-top:8px;margin-left:8px" onclick="activateDev()">Activar demo (dev)</button>' : ''}
            </div>
          </div>`;
      } else if (status === 'past_due') {
        alertEl.innerHTML = `
          <div class="sub-alert warn">
            <strong>Pago vencido.</strong> Por favor actualiza tu método de pago para evitar la interrupción del servicio.
            <button class="btn btn-warning btn-sm" style="margin-left:12px" onclick="openPortal()">Actualizar pago</button>
          </div>`;
      }

      if (status !== 'active') {
        document.getElementById('processes-container').innerHTML = `
          <div class="empty-state">
            <div class="empty-title">Acceso restringido</div>
            <div class="empty-sub">Activa tu suscripción para ver y gestionar procesos.</div>
          </div>`;
        document.getElementById('kpi-processes').textContent = '—';
        return;
      }
    }

    // Cargar resumen
    try {
      const summaries = await analysisApi.dashboardSummary();
      renderKPIs(summaries);
      renderProcessCards(summaries);
    } catch (err) {
      document.getElementById('processes-container').innerHTML = `
        <div class="alert alert-error">Error al cargar los procesos: ${escHtml(err.message)}</div>`;
    }
  }

  function renderKPIs(summaries) {
    document.getElementById('kpi-processes').textContent  = summaries.length;
    document.getElementById('kpi-capable').textContent    = summaries.filter(p => p.status === 'capaz').length;
    document.getElementById('kpi-marginal').textContent   = summaries.filter(p => p.status === 'marginal').length;
    document.getElementById('kpi-nocapable').textContent  = summaries.filter(p => p.status === 'no_capaz').length;
  }

  function renderProcessCards(summaries) {
    const el = document.getElementById('processes-container');
    summariesMap = {};
    if (!summaries.length) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-title">Sin procesos definidos</div>
          <div class="empty-sub">Crea tu primer proceso para comenzar el análisis de capacidad.</div>
          <a href="/processes.html" class="btn btn-primary" style="margin-top:16px">+ Crear proceso</a>
        </div>`;
      return;
    }

    el.innerHTML = `<div class="process-grid">${summaries.map(p => {
      summariesMap[p.id] = p;
      const status = p.status || 'sin_datos';
      const cpkTxt = p.cpk != null ? Number(p.cpk).toFixed(3) : '—';
      const specParts = [
        p.lsl     != null ? `<div class="spec-item"><span class="spec-label">LSI</span><span class="spec-val">${p.lsl} ${p.unit||''}</span></div>` : '',
        p.nominal != null ? `<div class="spec-item"><span class="spec-label">Nominal</span><span class="spec-val">${p.nominal} ${p.unit||''}</span></div>` : '',
        p.usl     != null ? `<div class="spec-item"><span class="spec-label">LSE</span><span class="spec-val">${p.usl} ${p.unit||''}</span></div>` : ''
      ].join('');

      return `
        <div class="process-card" onclick="openProcessPanel('${escHtml(String(p.id))}')">
          <div class="process-card-header">
            <div>
              <div class="process-name">${escHtml(p.name)}</div>
              <div class="process-unit">${escHtml(p.unit || 'Sin unidad')} · ${p.n} mediciones</div>
            </div>
            <div class="cpk-badge ${status}">${cpkTxt}</div>
          </div>
          <div class="process-specs">${specParts}</div>
          <div style="margin-top:10px;font-size:11px;color:var(--text-muted)">${cpkLabel(p.cpk)}</div>
        </div>`;
    }).join('')}</div>`;
  }

  function openProcessPanel(id) {
    const p = summariesMap[id];
    if (!p) return;

    const status   = p.status || 'sin_datos';
    const cpkTxt   = p.cpk != null ? Number(p.cpk).toFixed(3) : '—';
    const clr      = { capaz: 'var(--success)', marginal: 'var(--warning)', no_capaz: 'var(--danger)', sin_datos: 'var(--text-muted)' };
    const bg       = { capaz: 'var(--success-bg)', marginal: 'var(--warning-bg)', no_capaz: 'var(--danger-bg)', sin_datos: 'var(--card-alt)' };
    const bdr      = { capaz: 'var(--success-bdr)', marginal: 'var(--warning-bdr)', no_capaz: 'var(--danger-bdr)', sin_datos: 'var(--border)' };

    const specs = [
      p.lsl     != null ? { lbl: 'LSI',     val: `${p.lsl} ${p.unit || ''}`.trim()     } : null,
      p.nominal != null ? { lbl: 'Nominal', val: `${p.nominal} ${p.unit || ''}`.trim() } : null,
      p.usl     != null ? { lbl: 'LSE',     val: `${p.usl} ${p.unit || ''}`.trim()     } : null,
    ].filter(Boolean);

    const specsHtml = specs.length
      ? specs.map(s => `
          <div class="sp-spec-row">
            <span class="sp-spec-lbl">${s.lbl}</span>
            <span class="sp-spec-val">${escHtml(s.val)}</span>
          </div>`).join('')
      : '<div class="sp-spec-row" style="color:var(--text-muted);font-style:italic;font-size:12px">Sin especificaciones definidas</div>';

    const body = `
      <div style="padding:14px 16px;border-radius:var(--radius);border:1px solid ${bdr[status]};background:${bg[status]};margin-bottom:16px;display:flex;align-items:center;gap:14px">
        <div style="font-size:34px;font-weight:900;font-family:var(--font-data);color:${clr[status]};line-height:1">${cpkTxt}</div>
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${clr[status]}">${cpkLabel(p.cpk)}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:3px">${p.n} mediciones · ${escHtml(p.unit || 'sin unidad')}</div>
        </div>
      </div>

      <div class="sp-info-grid">
        <div class="sp-info-box">
          <div class="sp-info-lbl">Cpk</div>
          <div class="sp-info-val" style="color:${clr[status]}">${cpkTxt}</div>
        </div>
        <div class="sp-info-box">
          <div class="sp-info-lbl">Mediciones</div>
          <div class="sp-info-val">${p.n}</div>
        </div>
      </div>

      <div class="sp-section-lbl">Especificaciones</div>
      <div style="background:var(--card-alt);border:1px solid var(--border-lt);border-radius:var(--radius);margin-bottom:16px;overflow:hidden">
        ${specsHtml}
      </div>
    `;

    const footer = `
      <a href="/capability.html?process_id=${p.id}" class="btn btn-primary btn-sm" style="flex:1;text-align:center">Análisis de Capacidad</a>
      <a href="/monitoring.html?process_id=${p.id}" class="btn btn-secondary btn-sm">Monitoreo</a>
      <a href="/control-chart.html?process_id=${p.id}" class="btn btn-secondary btn-sm">Cartas</a>
    `;

    slidePanel.open({ title: escHtml(p.name), body, footer });
  }

  async function startCheckout() {
    try {
      const { url } = await billingApi.checkout();
      window.location.href = url;
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  async function openPortal() {
    try {
      const { url } = await billingApi.portal();
      window.location.href = url;
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  async function activateDev() {
    try {
      await billingApi.activateDev();
      location.reload();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  loadDashboard();
</script>
</body>
</html>
